// GoldenPie — default Xbox gamepad bindings for Spearmint (Quake III).
// Spearmint binds are GLOBAL (shared across all local splitscreen players); the per-player
// part is assigning each physical controller to a player slot (Controls -> Player # -> JOY ->
// Select Joystick), which the menu handles. So we only need one global set of binds here.
// Twin-stick: left stick = move, right stick = look, RT = fire, A = jump, B = crouch,
// shoulders = weapon switch, Start = scores.

seta in_joystick "1"
seta in_joystickNo "0"
seta in_joystickThreshold "0.15"

bind JOY_LEFTSTICK_UP "+forward"
bind JOY_LEFTSTICK_DOWN "+back"
bind JOY_LEFTSTICK_LEFT "+moveleft"
bind JOY_LEFTSTICK_RIGHT "+moveright"
bind JOY_RIGHTSTICK_LEFT "+left"
bind JOY_RIGHTSTICK_RIGHT "+right"
bind JOY_RIGHTSTICK_UP "+lookup"
bind JOY_RIGHTSTICK_DOWN "+lookdown"
bind JOY_RIGHTTRIGGER "+attack"
bind JOY_LEFTTRIGGER "+zoom"
bind JOY_A "+moveup"
bind JOY_B "+movedown"
bind JOY_RIGHTSHOULDER "weapnext"
bind JOY_LEFTSHOULDER "weapprev"
bind JOY_START "+scores"

// Reinitialize input so the joystick settings above take effect (devices get opened).
in_restart
