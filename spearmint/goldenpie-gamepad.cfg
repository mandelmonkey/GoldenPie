// GoldenPie — Spearmint (Quake III) gamepad setup for up to 4 splitscreen players.
//
// This file sets only the per-player JOYSTICK CVARS. The actual key BINDS are generated and
// appended by the adapter (adapters/spearmint-log.js) because they need per-player command
// prefixes that are easy to get wrong by hand:
//   Spearmint decides WHICH player a command moves from the COMMAND NAME, not the key. So
//   player 1 uses "+forward", player 2 uses "+2forward", player 3 "+3forward", player 4 "+4forward"
//   (the number goes right after the +/-; plain commands like weapnext become 2weapnext, etc.).
//   Binding player 2's keys to the UNPREFIXED command makes player 2's controller move player 1.
// The adapter also applies the macOS stick-Y inversion there, per player.

// --- Enable a joystick for each player, pointed at a distinct device (SDL enum order) ---
seta in_joystick "1"
seta 2in_joystick "1"
seta 3in_joystick "1"
seta 4in_joystick "1"

seta in_joystickNo "0"
seta 2in_joystickNo "1"
seta 3in_joystickNo "2"
seta 4in_joystickNo "3"

seta in_joystickThreshold "0.15"
seta 2in_joystickThreshold "0.15"
seta 3in_joystickThreshold "0.15"
seta 4in_joystickThreshold "0.15"

// Digital stick mode (axis -> direction key) so movement/look route through the per-player
// prefixed key binds (which carry the player) rather than the analog axis path.
seta in_joystickUseAnalog "0"
seta 2in_joystickUseAnalog "0"
seta 3in_joystickUseAnalog "0"
seta 4in_joystickUseAnalog "0"

// Open the joystick devices with the settings above.
in_restart
